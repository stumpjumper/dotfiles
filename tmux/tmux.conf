# ~/.tmux.conf

# Prefix: Ctrl-t (Emacs-friendly, low conflict)
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# Emacs-style in copy/scroll mode
set-window-option -g mode-keys emacs

# Snappy, no delay
set -s escape-time 0

# Mouse support ON — but with better scrolling/copy behavior
set -g mouse on

# OSC 52: let tmux push selections to the terminal's clipboard (works through SSH)
set -g set-clipboard on

# Better mouse wheel handling: scroll normally unless in copy mode or app captures mouse
bind -n WheelUpPane \
    if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
    "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Half-page wheel in copy mode (easier navigation)
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Mouse drag to select: start selection, copy on release, exit copy mode (no staying stuck)
# Prevents jump-back to bottom after copy. set-clipboard on sends OSC 52; no pbcopy pipe.
bind -T copy-mode-emacs MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-emacs MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Extra escapes from copy mode (handy if you get stuck)
bind-key -T copy-mode-emacs C-c     send-keys -X cancel
bind-key -T copy-mode-emacs Escape  send-keys -X cancel
bind-key -T copy-mode-emacs q       send-keys -X cancel

set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 20000
