# Herdr overrides mapped from ~/.tmux.conf (Ctrl-t prefix, Emacs, tmux muscle memory).
# Everything else uses Herdr defaults. Reload: herdr server reload-config
onboarding = false

[keys]
prefix = "ctrl+t"
detach = "prefix+d"
workspace_picker = ["prefix+w", "prefix+s"]
settings = "prefix+shift+s"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

[ui]
agent_panel_sort = "spaces"
